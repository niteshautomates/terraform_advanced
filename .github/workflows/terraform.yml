name: Terraform CI/CD

on:
  push:
    branches:
      - main   # run on push to main
  pull_request:  # also run on PRs for plan only
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0   # pick your version
      - name: Create workspaces
        run: |
          cd terraform_advanced
          terraform workspace new dev
          terraform workspace new stage
          terraform workspace new prod

      # Init Terraform
      - name: Terraform Init
        run: |
          cd terraform_advanced
          terraform workspace select dev 
          terraform init \
          --reconfigure \
          -backend-config="bucket=my-terraform-states-nitesh" \
          -backend-config="key=ec2/dev/terraform.tfstate" \
          -backend-config="region=ap-south-1" \
          -backend-config="dynamodb_table=terraform-locks" \
          -backend-config="encrypt=true"


      # Validate
      - name: Terraform Validate
        run: terraform validate

      # Plan
      - name: Terraform Plan
        run: |
          cd terraform_advanced
          terraform workspace select dev 
          terraform plan -var-file=dev.tfvars

      # Apply (only on push to main, not PRs)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd terraform_advanced
          terraform apply -var-file=dev.tfvars
